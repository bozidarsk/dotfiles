monitor=,1920x1200@165,auto,1

env = TERM,alacritty
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Nordic-cursors
env = HYPRCURSOR_THEME,Nordic-cursors
env = CURSOR_THEME,Nordic-cursors
env = GTK_THEME,Colloid-Dark-Nord

exec-once = mkdir /tmp/thumbnails
exec-once = rclone mount "Google Drive:" "$HOME/Google Drive"
exec-once = rclone mount "Proton Drive:" "$HOME/Proton Drive"
exec-once = wl-clip-persist --clipboard regular
exec-once = wl-paste --type text --watch $SHELL -c 'tee /tmp/clipboard-text && quickshell ipc call clipboard storeText' 
exec-once = wl-paste --type image --watch $SHELL -c 'base64 | tee /tmp/clipboard-image && quickshell ipc call clipboard storeImage' 
exec-once = hyprpaper
exec-once = hypridle
exec-once = hyprsunset -i
exec-once = quickshell
exec-once = quickshell ipc call shell reload
exec-once = eval $(ssh-agent)

input {
    kb_layout = us, bg, gr
    kb_variant = euro, phonetic, polytonic

    follow_mouse = 2
    float_switch_override_focus=0
    numlock_by_default = true
    # accel_profile = custom 1 0 1 2.14354692507 3.3483695221 4.59479341999 5.87309471544 7.17738719311 8.50369830827 9.84915530676 11.2115784565
    accel_profile = 
    scroll_method = 2fg
    sensitivity = 0.1

    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = false
        scroll_factor = 0.8
    }
}

device {
    name = razer-razer-basilisk-v2
    sensitivity = 0
    accel_profile = custom 1 0 1
}

device {
    name = razer-razer-basilisk-v2-1
    sensitivity = 0
    accel_profile = custom 1 0 1
}

cursor {
    no_warps = true
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(89a3c2ff)
    col.inactive_border = rgba(454951ff)

    layout = dwindle
}

decoration {
    rounding = 5
    rounding_power = 3

    active_opacity = 1.0
    inactive_opacity = 1.0

    dim_special = 1
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

binds {
    # hide_special_on_workspace_change = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    focus_on_activate = true
    close_special_on_empty = false
}

gesture = 3, horizontal, scale: 1, workspace
gesture = 4, horizontal, scale: 1, workspace
gesture = 3, up, dispatcher, fullscreen, 1 set
gesture = 3, down, dispatcher, fullscreen, 1 unset
gesture = 4, up, dispatcher, fullscreen, 0 set
gesture = 4, down, dispatcher, fullscreen, 0 unset

bindl = CONTROL ALT, Delete, exec, hyprctl dispatch exit
bind = SUPER, C, killactive,
bind = ALT, F4, killactive,

bind = SUPER, SUPER_L, exec, quickshell ipc call appLauncher toggle

# bind = SUPER, up, fullscreenstate, 1 0, set
# bind = SUPER, down, fullscreenstate, 0 0, set
# bind = SUPER, left, movefocus, l
# bind = SUPER, right, movefocus, r

bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r

bind = ALT, Tab, cyclenext,
bind = ALT, Tab, bringactivetotop
bind = ALT SHIFT, Tab, cyclenext, prev
bind = ALT SHIFT, Tab, bringactivetotop

# bind = ALT, Tab, workspace, +1
# bind = ALT SHIFT, Tab, workspace, -1

bind = , F11, fullscreen, 0, toggle
bind = SUPER SHIFT, up, swapwindow, u
bind = SUPER SHIFT, down, swapwindow, d
bind = SUPER SHIFT, left, swapwindow, l
bind = SUPER SHIFT, right, swapwindow, r
binde = SUPER ALT, up, resizeactive, 0 -50
binde = SUPER ALT, down, resizeactive, 0 50
binde = SUPER ALT, left, resizeactive, -50 0
binde = SUPER ALT, right, resizeactive, 50 0
bind = SUPER CONTROL, right, workspace, +1
bind = SUPER CONTROL, left, workspace, -1
bind = SUPER CONTROL SHIFT, right, movetoworkspace, +1
bind = SUPER CONTROL SHIFT, left, movetoworkspace, -1

bind = SUPER, Space, exec, hyprctl switchxkblayout all next && quickshell ipc call languages update
bind = SUPER SHIFT, Space, exec, hyprctl switchxkblayout all prev && quickshell ipc call languages update
bind = SUPER, D, togglespecialworkspace
bind = SUPER, L, exec, hyprlock
bind = SUPER, V, exec, quickshell ipc call clipboard open
bind = SUPER, T, exec, alacritty
bind = SUPER, E, exec, nemo
bind = SUPER, R, exec, rofi -show run
bind = SUPER, P, exec, hyprpicker | wl-copy
bind = SUPER SHIFT, S, exec, grim -g "$(slurp)" /proc/self/fd/1 | tee "$HOME/Pictures/Screenshots/Screenshot_$(date +'%Y%m%d_%H%M%S').png" | wl-copy
binde = SUPER, KP_Add, exec, zsh -c "hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | grep float | sed -E 's/float: (.+)/\1/' | awk '{ x = $1 + 0.1; print (x > 5.0 ? 5.0 : x) } ')"
binde = SUPER, KP_Subtract, exec, zsh -c "hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | grep float | sed -E 's/float: (.+)/\1/' | awk '{ x = $1 - 0.1; print (x < 1.0 ? 1.0 : x) } ')"

bind = SUPER, F, togglefloating,
bind = SUPER, J, layoutmsg, togglesplit

bind = SUPER, 1, exec, quickshell ipc call appLauncher run 0
bind = SUPER, 2, exec, quickshell ipc call appLauncher run 1
bind = SUPER, 3, exec, quickshell ipc call appLauncher run 2
bind = SUPER, 4, exec, quickshell ipc call appLauncher run 3
bind = SUPER, 5, exec, quickshell ipc call appLauncher run 4
bind = SUPER, 6, exec, quickshell ipc call appLauncher run 5
bind = SUPER, 7, exec, quickshell ipc call appLauncher run 6
bind = SUPER, 8, exec, quickshell ipc call appLauncher run 7
bind = SUPER, 9, exec, quickshell ipc call appLauncher run 8

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

bindele = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ && quickshell ipc call sound update

bindele = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && quickshell ipc call sound update

bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && quickshell ipc call sound update

bindel = , XF86Launch6, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindele = , XF86MonBrightnessUp, exec, brightnessctl --machine --class backlight set 5%+ && quickshell ipc call brightness update
bindele = , XF86MonBrightnessDown, exec, brightnessctl --machine --class backlight set 5%- && quickshell ipc call brightness update
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86RFKill, exec, quickshell ipc call rfkill update
bindl = , XF86TouchpadOn, exec, quickshell ipc call touchpadtoggle update true
bindl = , XF86TouchpadOff, exec, quickshell ipc call touchpadtoggle update false

windowrule {
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
    idle_inhibit = fullscreen
    # float = true
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}
