$font = Monospace

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 2, linear
    animation = fadeOut, 1, 2, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
}

label {
    monitor =
    text = $TIME
    font_size = 60
    font_family = $font

    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A %d %B" # update every 60 seconds
    font_size = 20
    font_family = $font

    position = 0, 70
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT[en,bg,gr]
    font_size = 18
    onclick = hyprctl switchxkblayout all next

    position = 180, -20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 15%, 4%
    outline_thickness = 2
    inner_color = rgba(0, 0, 0, 0.0)

    outer_color = rgba(89a3c2ff)
    check_color = rgba(00ff99ee)
    fail_color = rgba(ff6633ee)

    font_color = rgb(143, 143, 143)
    fade_on_empty = false
    rounding = 5

    # dots_text_format = *
    dots_center = false
    dots_size = 0.2
    dots_spacing = 0.3

    position = 0, -20
    halign = center
    valign = center

    font_family = $font
    fail_text = $PAMFAIL
    placeholder_text = <span>Password                </span>
}
